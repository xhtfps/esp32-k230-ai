[platformio]
; ==============================================================================
; PlatformIO 多环境配置文件
; ==============================================================================
; 本文件定义了三个编译环境，分别对应不同的运行模式：
;
; 1. esp32s3box  - WiFi + 上位机版（默认）
;    功能: ESP32 采集视频流，通过 WiFi 传输给电脑运行 AI 识别
;    适用: 有电脑、网络环境好的场景
;
; 2. esp32_local - 本地离线识别版
;    功能: ESP32 直接运行简化版姿态识别算法，无需电脑和 WiFi
;    适用: 比赛现场、无网络环境、需要完全自主运行的场景
;
; 3. atmega328   - Arduino 扩展板
;    功能: 接收 ESP32 指令，控制舵机和语音模块
;    适用: 与上述任一 ESP32 环境配合使用
;
; 切换方法:
;   修改本文件第 20 行的 default_envs 为对应环境名
;   或在命令行指定: pio run -e <环境名>
; ==============================================================================

; 默认编译环境（修改此处切换主程序）
default_envs = esp32s3box
; default_envs = esp32_local
; default_envs = atmega328


; ==================== 环境 1: WiFi + 上位机版 ====================
[env:esp32s3box]
platform = espressif32
board = esp32s3box
framework = arduino
board_build.arduino.usb_mode = enabled
board_build.partitions = huge_app.csv
monitor_speed = 115200

; 只编译 main.cpp（WiFi 视频流 + HTTP 服务器），排除其他程序
build_src_filter = +<main.cpp> +<config.h> -<arduino_receiver.cpp> -<esp32_pose_local.cpp>

; 头文件搜索路径
build_flags = -I include


; ==================== 环境 2: 本地离线识别版 ====================
[env:esp32_local]
platform = espressif32
board = esp32s3box
framework = arduino
board_build.arduino.usb_mode = enabled
board_build.partitions = huge_app.csv
monitor_speed = 115200

; 只编译 esp32_pose_local.cpp（本地姿态识别），排除其他程序
build_src_filter = +<esp32_pose_local.cpp> +<config.h> -<main.cpp> -<arduino_receiver.cpp>

; 头文件搜索路径
build_flags = -I include


; ==================== 环境 3: Arduino ATmega328 扩展板 ====================
[env:atmega328]
platform = atmelavr

; 根据实际板子选择以下之一：
; - uno                 : Arduino Uno (ATmega328P, 16MHz)
; - nanoatmega328       : Arduino Nano (ATmega328P, 16MHz, Old Bootloader)
; - nanoatmega328new    : Arduino Nano (ATmega328P, 16MHz, New Bootloader)
; - pro8MHzatmega328    : Arduino Pro Mini (ATmega328P, 8MHz, 3.3V)
; - pro16MHzatmega328   : Arduino Pro Mini (ATmega328P, 16MHz, 5V)
; - diecimilaatmega328  : Arduino Duemilanove (ATmega328)
board = uno

framework = arduino
monitor_speed = 115200

; 只编译 arduino_receiver.cpp（指令接收 + 舵机控制），排除其他程序
build_src_filter = +<arduino_receiver.cpp> +<config.h> -<main.cpp> -<esp32_pose_local.cpp>

; 头文件搜索路径
build_flags = -I include

; Arduino 上传波特率（若上传失败可尝试改为 57600）
upload_speed = 115200

; 若使用 Arduino as ISP 或 USBasp 烧录，取消下面注释并修改
; upload_protocol = usbasp
; upload_flags = -Pusb